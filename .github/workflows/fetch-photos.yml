name: Fetch Instagram photos

on:
  workflow_dispatch:
  push:
    paths:
      - instagram/photos/wanted.json
      - instagram/scripts/fetch_photos.py

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python instagram/scripts/fetch_photos.py
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add instagram/photos
          git diff --cached --quiet || git commit -m "Fetch licensed portrait photos from Wikimedia Commons"
          git push
